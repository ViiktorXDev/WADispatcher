<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WA Dispatcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="screen active">
    <header class="setup-header">
      <div class="logo">WA<span>Dispatcher</span></div>
      <p class="tagline">Envio em série. Sem enrolação.</p>
    </header>

    <main class="setup-main">
      <div class="card" id="numbers-card">
        <label class="card-label">
          <span class="label-num">01</span>
          Números de telefone
        </label>
        <textarea id="numbers-input" placeholder="558487259292&#10;5513997021924&#10;558598061309&#10;..."></textarea>
        <div class="card-hint">Um número por linha, com DDI (ex: 5511999999999)</div>
      </div>

      <div class="card" id="message-card">
        <label class="card-label">
          <span class="label-num">02</span>
          Mensagem
        </label>
        <textarea id="message-input" placeholder="Digite a mensagem que será enviada..."></textarea>
        <div class="card-hint">O texto será codificado automaticamente na URL</div>
      </div>

      <div class="actions-row">
        <button id="btn-start" class="btn-primary">Iniciar disparo →</button>
        <button id="btn-restore" class="btn-ghost hidden">↩ Retomar sessão anterior</button>
      </div>
    </main>
  </div>

  <!-- DISPATCH SCREEN -->
  <div id="dispatch-screen" class="screen">
    <header class="dispatch-header">
      <button id="btn-back" class="btn-icon" title="Voltar à configuração">←</button>
      <div class="logo small">WA<span>Dispatcher</span></div>
      <button id="btn-reset" class="btn-icon danger" title="Resetar lista">✕</button>
    </header>

    <div class="progress-bar-wrap">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <main class="dispatch-main">
      <!-- Current number focal area -->
      <div class="focal-card">
        <div class="focal-label">Número atual</div>
        <div id="current-number" class="focal-number">—</div>
        <div id="current-link" class="focal-link">—</div>

        <div class="focal-actions">
          <button id="btn-open" class="btn-primary large">Abrir no WhatsApp ↗</button>
          <button id="btn-copy-link" class="btn-ghost">Copiar link</button>
        </div>
      </div>

      <!-- Counter -->
      <div class="counter-row">
        <span id="counter-text" class="counter">0 de 0 enviados</span>
        <button id="btn-export" class="btn-tiny">Exportar restantes</button>
      </div>

      <!-- Navigation -->
      <div class="nav-row">
        <button id="btn-prev" class="btn-nav">← Anterior</button>
        <button id="btn-next" class="btn-nav primary">Marcar enviado + Próximo →</button>
      </div>

      <!-- Number list -->
      <div class="list-section">
        <div class="list-header">
          <span>Lista completa</span>
          <span id="list-stats"></span>
        </div>
        <div id="numbers-list" class="numbers-list"></div>
      </div>
    </main>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <!-- MODAL: Export restantes -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-title">Números restantes</div>
      <textarea id="modal-content" readonly></textarea>
      <div class="modal-actions">
        <button id="btn-copy-remaining" class="btn-primary">Copiar</button>
        <button id="btn-close-modal" class="btn-ghost">Fechar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
